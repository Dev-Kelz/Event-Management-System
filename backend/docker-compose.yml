version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: event_management_db
    environment:
      POSTGRES_USER: ${DB_USER:-eventuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpass}
      POSTGRES_DB: ${DB_NAME:-event_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - event_network

  # FastAPI Application
  web:
    build: .
    container_name: event_management_app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eventuser}:${DB_PASSWORD:-eventpass}@db:5432/${DB_NAME:-event_management}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - event_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: event_management_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - web
    networks:
      - event_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:

networks:
  event_network:
    driver: bridge
